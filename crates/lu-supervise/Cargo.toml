[package]
name = "lu-supervise"
description = "Supervise a harness child in its own process group: timeouts, idle-output timeout, SIGTERM then SIGKILL, capped output."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Signalling a whole process group with a safe API; rustix is the low-level layer
# under many maintained crates and keeps the unsafe code out of this crate.
lu-config = { path = "../lu-config" }
rustix = { version = "1", default-features = false, features = ["process", "std"] }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
