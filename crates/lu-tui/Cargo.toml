[package]
name = "lu-tui"
description = "Terminal dashboard: pure model and view, ratatui drawing and a terminal guard behind a feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Off by default: the model and sanitizer build without a terminal library.
tui = ["dep:ratatui", "dep:crossterm", "dep:fw-tui", "fw-tui/tui"]

[dependencies]
lu-proto = { path = "../lu-proto" }
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }
fw-tui = { git = "https://github.com/ddproxy/fw-tui", rev = "8a9fb414c79d7784009e1a3ec3a3688e197931fe", optional = true }

[lints]
workspace = true
