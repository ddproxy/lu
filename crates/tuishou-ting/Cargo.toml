[package]
name = "tuishou-ting"
description = "Ting: the node-side job loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
git2 = { version = "0.21", default-features = false }
lu-client = { path = "../lu-client" }
lu-config = { path = "../lu-config" }
lu-proto = { path = "../lu-proto" }
lu-staging = { path = "../lu-staging" }
lu-supervise = { path = "../lu-supervise" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
git2 = { version = "0.21", default-features = false }
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tempfile = "3"
lu-proto = { path = "../lu-proto" }
lu-staging = { path = "../lu-staging" }
lu-supervise = { path = "../lu-supervise" }

[lints]
workspace = true
