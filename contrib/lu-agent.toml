# Sample agent config. Copy to /etc/lu/agent.toml on the agent host.
#
#   0.1.0 has no agent runtime and no `lu agent` subcommand: this file is a
#   deployment sample for the intended agent, not a runnable service yet. Do not
#   enable lu-agent.service in this release.
#
# The token file contains the plaintext agent token, not its hash. It must be a
# regular file owned by lu with mode 0600 or tighter.
#
#   printf '%s' "$(head -c 32 /dev/urandom | base64)" > /etc/lu/agent.token
#   chown lu:lu /etc/lu/agent.token
#   chmod 0600 /etc/lu/agent.token

[agent]
name = "node-a"
controller_url = "https://lu.example.net:7600"
token_file = "/etc/lu/agent.token"
work_dir = "/var/lib/lu/work"
harness = "opencode"
heartbeat_secs = 15

# Optional: a private CA to add to the system trust roots. Do not use this to
# disable verification; the client always verifies the controller certificate.
# ca_file = "/etc/lu/tls/ca.pem"

# Optional harness endpoint and health check. The health URL must be loopback,
# and its token file follows the same private-file rules as token_file.
# opencode_server = "http://127.0.0.1:4096"
# reiki_health_url = "http://127.0.0.1:9000/health"
# reiki_token_file = "/etc/lu/reiki.token"

[log]
level = "info"
format = "text"
stderr = true
