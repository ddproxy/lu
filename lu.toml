# Example controller config for lu. Check it with: lu check --config lu.toml
# Replace placeholders (node-a, paths, token hashes) before real use.
# The hashes below are placeholders, not credentials. Generate real ones:
#   printf '%s' "$(head -c 32 /dev/urandom | base64)" > token
#   sha256sum token

[controller]
listen = "127.0.0.1:7600"
db = "/var/lib/lu/lu.db"
artifacts_dir = "/var/lib/lu/artifacts"

[[controller.agents]]
name = "node-a"
token_sha256 = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

[[controller.operators]]
name = "ops"
token_sha256 = "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"

# Optional repository mirror and commit pinning:
# [[controller.repos]]
# name = "app"
# url = "https://git.example.net/team/app.git"
# credential_file = "/etc/lu/app.credential"   # username:password or a token
# refs = ["main", "release/*"]

# For an agent host, add an [agent] table instead (or in addition). Example:
# [agent]
# name = "node-a"
# controller_url = "https://lu.example.net:7600"
# token_file = "/etc/ting/ting.token"   # mode 0600 or tighter
# work_dir = "/srv/work/lu"
# Jobs select a harness profile; the built-in opencode profile needs no entry here.

# Controller-side scrubbing is on by default. Add operator patterns like this:
# [artifacts]
# scrub = true
#
# [[artifacts.extra_rules]]
# name = "internal_ref"
# pattern = "INTERNAL-[A-Z0-9]{6,}"

[log]
level = "info"
format = "text"
stderr = true
