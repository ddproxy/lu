name: audit

on:
  push:
  pull_request:
  schedule:
    - cron: '13 3 * * *'

permissions: {}

jobs:
  cargo-deny:
    # The ruleset requires a check named Audit; keep the name in step with the other repositories.
    name: Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories bans licenses sources
