name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  create:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag --draft

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binaries: the target hosts run an older glibc than the runners do.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install Rust
        run: |
          rustup toolchain install 1.99 --profile minimal -t ${{ matrix.target }}
          rustup default 1.99
      - name: Build
        run: cargo build --release --locked -p lu --features tui --target ${{ matrix.target }}
        env:
          CFLAGS_x86_64_unknown_linux_musl: -march=x86-64 -mtune=generic
      - name: Smoke-run the binary on hosts that can run it
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/lu"
          case "$(uname -m)" in
            x86_64) host=x86_64 ;;
            arm64|aarch64) host=aarch64 ;;
            *) host=unknown ;;
          esac
          case "${{ matrix.target }}" in
            "$host"-*) ;;
            *) echo "skipping: ${{ matrix.target }} cannot run on $host"; exit 0 ;;
          esac
          "$bin" --version
          "$bin" check --config lu.toml
      - name: Package
        run: |
          name="lu-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/lu" LICENSE README.md CHANGELOG.md SECURITY.md "$name/"
          cp -R docs contrib "$name/"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lu-${{ matrix.target }}
          path: |
            lu-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            lu-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  sbom:
    needs: create
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.99'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.10
      - name: Generate CycloneDX SBOM
        run: |
          cargo cyclonedx --manifest-path app/Cargo.toml --format json \
            --features tui --spec-version 1.5 \
            --override-filename "lu-${GITHUB_REF_NAME}-sbom"
          mv "app/lu-${GITHUB_REF_NAME}-sbom.json" .
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lu-sbom
          path: lu-*-sbom.json
          if-no-files-found: error

  publish:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lu-*
          merge-multiple: true
          path: dist
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/*
      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
