name: release

on:
  push:
    tags: ["v*"]
  # The dev-release workflow builds an automatic dev tag through here.
  workflow_call:
    inputs:
      tag:
        description: Tag to build and publish
        required: true
        type: string

permissions: {}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pre-release tag (v0.6.2-dev.7.g1a2b3c4) is a dev build and never "latest".
          case "$TAG" in
            *-*)
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                --title "$TAG" --generate-notes --verify-tag --draft --prerelease --latest=false ;;
            *)
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                --title "$TAG" --generate-notes --verify-tag --draft ;;
          esac

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binaries: the target hosts run an older glibc than the runners do.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Set the build version from the tag
        run: python3 scripts/set-release-version.py "$TAG"
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install Rust
        run: |
          rustup toolchain install 1.99 --profile minimal -t ${{ matrix.target }}
          rustup default 1.99
      - name: Build
        run: |
          cargo build --release --locked -p lu --features tui --target ${{ matrix.target }}
          cargo build --release --locked -p tuishou-ting --target ${{ matrix.target }}
        env:
          CFLAGS_x86_64_unknown_linux_musl: -march=x86-64 -mtune=generic
      - name: Smoke-run the binaries on hosts that can run them
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/lu"
          case "$(uname -m)" in
            x86_64) host=x86_64 ;;
            arm64|aarch64) host=aarch64 ;;
            *) host=unknown ;;
          esac
          case "${{ matrix.target }}" in
            "$host"-*) ;;
            *) echo "skipping: ${{ matrix.target }} cannot run on $host"; exit 0 ;;
          esac
          "$bin" --version
          "$bin" check --config lu.toml
          "target/${{ matrix.target }}/release/ting" --version
      - name: Package
        run: |
          name="lu-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/lu" "target/${{ matrix.target }}/release/ting" LICENSE README.md CHANGELOG.md SECURITY.md "$name/"
          cp -R docs contrib "$name/"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lu-${{ matrix.target }}
          path: |
            lu-${{ env.TAG }}-${{ matrix.target }}.tar.gz
            lu-${{ env.TAG }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  sbom:
    needs: create
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Set the build version from the tag
        run: python3 scripts/set-release-version.py "$TAG"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.99'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.10
      - name: Generate CycloneDX SBOM
        run: |
          cargo cyclonedx --manifest-path app/Cargo.toml --format json \
            --features tui --spec-version 1.5 \
            --override-filename "lu-${TAG}-sbom"
          mv "app/lu-${TAG}-sbom.json" .
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lu-sbom
          path: lu-*-sbom.json
          if-no-files-found: error

  publish:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lu-*
          merge-multiple: true
          path: dist
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/*
      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
