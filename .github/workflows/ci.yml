name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The workspace requires Rust 1.99; install it even when the runner has an older cargo.
      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain 1.99 -c rustfmt -c clippy
          else
            rustup toolchain install 1.99 --profile minimal -c rustfmt -c clippy
            rustup default 1.99
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --features tui -- -D warnings
      - name: Check monitoring assets
        run: ./scripts/check-monitoring.sh
      - name: Check docs examples
        run: ./scripts/check-docs.sh
      - run: cargo test --locked --workspace
      - run: cargo test --locked --workspace --features tui

  # An agent and a controller from different releases must keep working together, and a new
  # controller must migrate a database created by the previous release. Wire changes that break
  # that fail here, not on a node.
  compat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain 1.99
          else
            rustup toolchain install 1.99 --profile minimal
            rustup default 1.99
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Fetch the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
          [ -n "$tag" ] || { echo "no published release to compare against"; exit 1; }
          mkdir -p prev
          cd prev
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "lu-${tag}-x86_64-unknown-linux-musl.tar.gz*"
          sha256sum -c "lu-${tag}-x86_64-unknown-linux-musl.tar.gz.sha256"
          tar -xzf "lu-${tag}-x86_64-unknown-linux-musl.tar.gz" --strip-components=1
          ./lu --version
      - run: cargo build --locked --bins
      - name: Previous agent with the new controller
        run: ./scripts/compat-test.sh target/debug prev prev
      - name: New agent with the previous controller
        run: ./scripts/compat-test.sh prev target/debug

  # The release builds static musl binaries; build one here so a release is never the first try.
  musl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install Rust
        run: |
          rustup toolchain install 1.99 --profile minimal -t x86_64-unknown-linux-musl
          rustup default 1.99
      - name: Build
        run: |
          cargo build --release --locked -p lu --features tui --target x86_64-unknown-linux-musl
          cargo build --release --locked -p tuishou-ting --target x86_64-unknown-linux-musl
        env:
          CFLAGS_x86_64_unknown_linux_musl: -march=x86-64 -mtune=generic
      - name: Smoke-run the static binaries
        run: |
          bin=target/x86_64-unknown-linux-musl/release/lu
          "$bin" --version
          "$bin" check --config lu.toml
          file "$bin" | grep -Eq "statically linked|static-pie linked"
          ting=target/x86_64-unknown-linux-musl/release/ting
          "$ting" --version
          file "$ting" | grep -Eq "statically linked|static-pie linked"
