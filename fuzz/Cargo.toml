[package]
name = "lu-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
git2 = { version = "0.21", default-features = false }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "rt"] }

lu-auth = { path = "../crates/lu-auth" }
lu-client = { path = "../crates/lu-client", features = ["fuzzing"] }
lu-config = { path = "../crates/lu-config" }
lu-controller = { path = "../crates/lu-controller" }
lu-proto = { path = "../crates/lu-proto" }
lu-staging = { path = "../crates/lu-staging" }

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "patch_inflate"
path = "fuzz_targets/patch_inflate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "patch_apply"
path = "fuzz_targets/patch_apply.rs"
test = false
doc = false
bench = false

