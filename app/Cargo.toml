[package]
name = "lu"
description = "Lu: a job queue and dispatcher for dev peers (controller, agent and CLI in one binary)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The `top` subcommand. The model and `lu graph` build without a terminal library.
tui = ["lu-tui/tui"]

[dependencies]
lu-config = { path = "../crates/lu-config" }
lu-auth = { path = "../crates/lu-auth" }
lu-serve = { path = "../crates/lu-serve" }
lu-controller = { path = "../crates/lu-controller" }
lu-store = { path = "../crates/lu-store" }
lu-client = { path = "../crates/lu-client" }
lu-agent = { path = "../crates/lu-agent" }
lu-proto = { path = "../crates/lu-proto" }
lu-tui = { path = "../crates/lu-tui" }
axum.workspace = true
clap = { workspace = true }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW for the log file; std has no constant for it.
libc.workspace = true

[lints]
workspace = true

[dev-dependencies]
lu-supervise = { path = "../crates/lu-supervise" }
tempfile = "3"
