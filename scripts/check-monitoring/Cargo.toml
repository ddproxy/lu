[package]
name = "check-monitoring"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone tool, like scripts/check-workflows: the root workspace does not build it.
[workspace]

[dependencies]
serde_json = "1"
serde_yaml = "=0.9.34"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
